name: Publish Carellas beta package

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-beta.yml"
      - "carellas-beta-code.zip"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified beta package
        run: unzip -o carellas-beta-code.zip
      - name: Publish beta files
        run: |
          git config user.name "Carellas Beta Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add carellas_media_ads_beta tests/test_beta_server.py README.md
          git diff --cached --quiet && exit 0
          git commit -m "Publish Carellas Media Ads Beta 0.5.0-beta.1"
          git push
