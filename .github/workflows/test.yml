name: Beta checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile
        run: python -m py_compile carellas_media_ads/app/server.py carellas_media_ads_beta/app/server.py
      - name: Validate dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          # Stabile e beta: pannello, pagina operatori e pannello precedente (/classic).
          for addon in ("carellas_media_ads", "carellas_media_ads_beta"):
              for page in ("index", "operatori", "index_classic"):
                  html = Path(f"{addon}/app/{page}.html").read_text()
                  scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
                  if not scripts:
                      raise SystemExit(f"No inline JavaScript found in {addon}/app/{page}.html")
                  Path(f"/tmp/{addon}-{page}.js").write_text("\n".join(scripts))
          PY
          for file in /tmp/carellas_media_ads*-*.js; do node --check "$file"; done
      - name: Unit tests
        run: python -m unittest discover -s tests -v
