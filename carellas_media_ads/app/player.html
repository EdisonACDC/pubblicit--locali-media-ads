<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080604">
  <title>Carellas TV</title>
  <style>
    :root{--gold:#dda83e;--cream:#fff0d4;--red:#761e1b;--panel:#1d1510e8}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:var(--cream);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    #video{position:fixed;inset:0;width:100vw;height:100vh;background:#000;object-position:center;display:none}
    #login,#message,#start{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 10%,#64231b,#1c100b 48%,#070504)}
    .panel{width:min(480px,100%);padding:28px;border:1px solid #855b30;border-radius:24px;background:var(--panel);box-shadow:0 25px 80px #000b;text-align:center}
    .seal{width:76px;height:76px;margin:0 auto 15px;display:grid;place-items:center;border:3px solid var(--gold);border-radius:50%;font:700 34px Georgia;color:var(--gold)}
    h1{margin:0 0 6px;font:700 clamp(30px,6vw,45px) Georgia}p{color:#d8c5ac}label{display:block;text-align:left;margin:14px 0 5px;color:#e9d8c2}
    input{width:100%;border:1px solid #684b35;border-radius:12px;padding:13px 14px;background:#0c0907;color:white;font:inherit;font-size:18px;outline:none}input:focus{border-color:var(--gold)}
    .password-wrap{position:relative}.password-wrap input{padding-right:58px}.password-toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:46px;height:42px;padding:0;background:transparent;color:var(--cream);font-size:22px;line-height:1}.password-toggle:focus{outline:2px solid var(--gold);outline-offset:0}
    button{border:0;border-radius:12px;padding:13px 18px;background:var(--gold);color:#211408;font:700 17px system-ui;cursor:pointer}button:focus{outline:3px solid white;outline-offset:3px}.wide{width:100%;margin-top:20px}.error{min-height:23px;color:#ff8982}
    #message,#start{display:none;background:#000b;z-index:3}.message-panel{max-width:680px}.message-panel button{margin-top:12px}
    #controls{position:fixed;z-index:4;top:0;right:0;display:none;gap:8px;padding:14px;opacity:0;transition:opacity .25s}body:hover #controls,body.controls #controls{opacity:1}#controls button{background:#120d0bcc;color:white;border:1px solid #ffffff44;padding:9px 12px;font-size:14px}
    #language{position:fixed;z-index:5;top:14px;left:14px;display:flex;gap:5px}#language button{padding:7px 10px;background:#120d0bcc;color:white;border:1px solid #ffffff44;font-size:13px}#language button.active{background:var(--gold);color:#211408}
    .spinner{width:44px;height:44px;margin:18px auto;border:4px solid #ffffff30;border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="language"><button data-lang="it" onclick="setLanguage('it')">IT</button><button data-lang="de" onclick="setLanguage('de')">DE</button></div>
  <video id="video" playsinline preload="auto"></video>
  <div id="login"><form id="loginForm" class="panel"><div class="seal">C</div><h1>Carellas TV</h1><p data-it="Accedi allo schermo pubblicitario" data-de="Am Werbebildschirm anmelden">Accedi allo schermo pubblicitario</p><label for="username" data-it="Nome utente" data-de="Benutzername">Nome utente</label><input id="username" autocomplete="username" required><label for="password">Password</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required><button id="passwordToggle" class="password-toggle" type="button" onclick="togglePassword('password',this)" aria-label="Visualizza password" title="Visualizza password">👁</button></div><button class="wide" type="submit" data-it="Accedi e avvia" data-de="Anmelden und starten">Accedi e avvia</button><div id="loginError" class="error"></div></form></div>
  <div id="message"><div class="panel message-panel"><div class="seal">C</div><h1 id="messageTitle" data-it="Preparazione canale" data-de="Kanal wird vorbereitet">Preparazione canale</h1><div class="spinner"></div><p id="messageText" data-it="Il canale non è ancora pronto. Crealo dalla sezione IPTV multi-TV di Carellas Media Ads." data-de="Der Kanal ist noch nicht bereit. Erstelle ihn im Bereich IPTV Multi-TV von Carellas Media Ads.">Il canale non è ancora pronto. Crealo dalla sezione IPTV multi-TV di Carellas Media Ads.</p><button onclick="refreshState()" data-it="Riprova" data-de="Erneut versuchen">Riprova</button></div></div>
  <div id="start"><div class="panel message-panel"><div class="seal">▶</div><h1 data-it="Avvia pubblicità" data-de="Werbung starten">Avvia pubblicità</h1><p data-it="Il televisore richiede un primo comando per consentire la riproduzione con audio." data-de="Der Fernseher benötigt einen ersten Befehl, um die Wiedergabe mit Ton zu erlauben.">Il televisore richiede un primo comando per consentire la riproduzione con audio.</p><button onclick="startPlayback(true)" data-it="▶ Avvia video e audio" data-de="▶ Video und Ton starten">▶ Avvia video e audio</button></div></div>
  <div id="controls"><button onclick="enterFullscreen()" data-it="⛶ Schermo intero" data-de="⛶ Vollbild">⛶ Schermo intero</button><button onclick="logout()" data-it="Esci" data-de="Abmelden">Esci</button></div>
  <script>
    const $=id=>document.getElementById(id);let currentUrl='',pollTimer=null;
    function togglePassword(inputId,button){const input=$(inputId),show=input.type==='password';input.type=show?'text':'password';const lang=document.documentElement.lang==='de'?'de':'it',labels=show?{it:'Nascondi password',de:'Passwort ausblenden'}:{it:'Visualizza password',de:'Passwort anzeigen'};button.textContent=show?'🙈':'👁';button.setAttribute('aria-label',labels[lang]);button.title=labels[lang]}
    function setLanguage(lang){lang=lang==='de'?'de':'it';document.documentElement.lang=lang;localStorage.setItem('carellas-tv-language',lang);document.querySelectorAll('[data-it]').forEach(element=>element.textContent=element.dataset[lang]);document.querySelectorAll('#language button').forEach(button=>button.classList.toggle('active',button.dataset.lang===lang))}
    async function request(path,options){const response=await fetch(path,{cache:'no-store',...options});let body={};try{body=await response.json()}catch(e){}if(!response.ok)throw Object.assign(new Error(body.error||'Errore di collegamento'),{status:response.status});return body}
    function show(name){['login','message','start'].forEach(id=>$(id).style.display=id===name?'grid':'none');$('video').style.display=name?'none':'block';$('controls').style.display=name?'none':'flex'}
    async function refreshState(){try{const state=await request('/api/state');if(!state.ready){show('message');return}const video=$('video');video.style.objectFit=state.fit==='cover'?'cover':'contain';if(currentUrl!==state.video_url){currentUrl=state.video_url;video.src=currentUrl;video.load()}show('');await startPlayback(false)}catch(error){if(error.status===401){show('login');clearInterval(pollTimer)}else{$('messageText').textContent=error.message;show('message')}}}
    async function startPlayback(userGesture){const video=$('video');try{video.muted=false;video.volume=1;await video.play();show('');if(userGesture)enterFullscreen()}catch(error){show('start')}}
    $('loginForm').addEventListener('submit',async event=>{event.preventDefault();$('loginError').textContent='';try{await request('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});$('password').value='';await refreshState();clearInterval(pollTimer);pollTimer=setInterval(refreshState,30000)}catch(error){$('loginError').textContent=error.message}});
    $('video').addEventListener('ended',()=>{ $('video').currentTime=0;startPlayback(false) });
    $('video').addEventListener('error',()=>setTimeout(refreshState,4000));
    async function enterFullscreen(){try{const root=document.documentElement;if(root.requestFullscreen)await root.requestFullscreen();else if($('video').webkitEnterFullscreen)$('video').webkitEnterFullscreen()}catch(e){}}
    async function logout(){try{await request('/api/logout',{method:'POST'})}finally{currentUrl='';$('video').removeAttribute('src');$('video').load();show('login')}}
    document.addEventListener('mousemove',()=>{document.body.classList.add('controls');clearTimeout(window.controlsTimeout);window.controlsTimeout=setTimeout(()=>document.body.classList.remove('controls'),2500)});
    const preferredLanguage=localStorage.getItem('carellas-tv-language')||((navigator.language||'').toLowerCase().startsWith('de')?'de':'it');setLanguage(preferredLanguage);refreshState();pollTimer=setInterval(refreshState,30000);
  </script>
</body>
</html>
