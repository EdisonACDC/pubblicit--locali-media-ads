<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14100D">
<title>Carellas Media Ads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Nuova interfaccia "per zona" (mock Carellas Media Ads — UI Redesign).
   Struttura dalla tavola C, palette e caratteri dalla tavola A. */
:root{
  --bg:#14100D;--bg2:#17120F;--side:#120E0B;--card:#1C1612;--card2:#241A14;--well:#211A15;
  --line:#33291F;--line2:#4A3B2F;--line3:#2A211A;--track:#2E241C;--chip:#2A2019;
  --gold:#E0AC4A;--gold2:#F2C873;--gold-ink:#1E1408;--gold-soft:#3B2C1A;
  --text:#F4EADB;--title:#FFF4E0;--muted:#A8977F;--muted2:#B9A994;--dim:#8F8070;
  --green:#5CC38F;--green-soft:#1F2A26;--green-line:#2F4A3E;--green-text:#A9DCC2;
  --warn:#F0A35E;--warn-soft:#3A2414;--red:#E8857E;--red-line:#5A2E2A;--red-soft:#3A1915;
  --blue:#7FA7D9;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --radius:16px;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--gold)}a:hover{color:var(--gold2)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font:500 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.muted2{color:var(--muted2)}.small{font-size:13px}.tiny{font-size:12px}
.ok-text{color:var(--green)}.warn-text{color:var(--warn)}.err-text{color:var(--red)}

/* Layout: menu laterale con zone (tavola C) + contenuto */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:var(--side);border-right:1px solid var(--line3);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto;align-self:flex-start}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;color:var(--title);font:600 17px var(--display)}
.seal{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;color:var(--gold);font:600 17px var(--display);flex:none}
.side .cap{padding:12px 12px 4px}
.side a{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border-radius:9px;color:var(--muted2);text-decoration:none;font-weight:500}
.side a:hover{background:var(--card);color:var(--text)}
.side a[aria-current="page"]{background:var(--chip);color:var(--title)}
.side a .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side a .meta{font-size:12px;color:var(--muted)}
.side .sub a{min-height:34px;padding-left:44px;font-size:14px}
.side .sep{height:1px;background:var(--line3);margin:12px 6px}
.side svg{flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:#6B5D50;flex:none;display:inline-block}
.dot.on{background:var(--green)}.dot.spot{background:var(--gold)}
.dot.off{background:var(--warn);border-radius:1px;transform:rotate(45deg)}
.main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:flex-end;gap:14px;flex-wrap:wrap;padding:12px 28px;border-bottom:1px solid var(--line3);background:var(--bg2);position:sticky;top:0;z-index:5}
.top .mobile-brand{display:none}
.saved-state{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.engine{display:inline-flex;align-items:center;gap:7px;color:var(--muted2);font-size:13px}
.seg{display:inline-flex;border:1px solid #3A2E25;border-radius:8px;overflow:hidden}
.seg button{min-height:34px;padding:0 12px;background:transparent;color:var(--muted);border:0;font:600 13px var(--sans);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--title)}
main{width:100%;max-width:1360px;margin:0 auto;padding:26px 28px 120px;display:flex;flex-direction:column;gap:20px;outline:none}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head h1{margin:4px 0 0;font:500 38px/1.1 var(--display);color:var(--title)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.split{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.split>.wide{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:20px}
.split>.narrow{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:20px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}

/* Componenti */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-width:0}
.card h2{margin:0;font:500 20px var(--display);color:var(--title)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;font:600 14px var(--sans);cursor:pointer;border:1px solid transparent;text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--gold);color:var(--gold-ink)}.btn-primary:hover{background:var(--gold2);color:var(--gold-ink)}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--line2)}.btn-ghost:hover{background:var(--card2);color:var(--title)}
.btn-quiet{background:transparent;color:var(--red);border-color:var(--red-line)}.btn-quiet:hover{background:var(--red-soft)}
.btn-danger{background:#8E2A24;color:#fff}
.btn-sm{min-height:36px;padding:0 12px;font-size:13px}
.btn-link{background:none;border:0;padding:0;color:var(--gold);font-weight:600;cursor:pointer;min-height:32px}
.btn:focus-visible,.btn-link:focus-visible,.chip:focus-visible,.sw:focus-visible,.pick:focus-visible,.seg button:focus-visible,.side a:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sw{width:48px;height:28px;border-radius:99px;border:0;padding:3px;cursor:pointer;display:flex;flex:none;background:#3A2E25;justify-content:flex-start;transition:background .15s}
.sw[aria-checked="true"]{background:var(--gold);justify-content:flex-end}
.sw .knob{width:22px;height:22px;border-radius:50%;background:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);background:transparent;color:var(--text);font:500 13px var(--sans);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600}
.tv-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 0;border-top:1px solid var(--line3)}
.chip.dim{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13px}
.badge{font:600 12px var(--mono);color:var(--gold-ink);background:var(--warn);border-radius:99px;padding:2px 8px;vertical-align:middle}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.field>span,.field>label{font:600 12px var(--sans);color:var(--muted2)}
.inp,select.inp{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:9px;background:#110D0A;color:var(--text);font:500 15px var(--sans)}
.inp.time{font-family:var(--mono);max-width:140px}
.mblock.clash{outline:2px solid var(--red);outline-offset:-2px}
input[type=range]{width:100%;accent-color:var(--gold)}
input[type=checkbox],input[type=radio]{accent-color:var(--gold);width:18px;height:18px}
.pw-wrap{position:relative}.pw-wrap .inp{padding-right:52px}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:38px;border:0;border-radius:8px;background:transparent;color:var(--muted2);cursor:pointer;display:grid;place-items:center}
.pw-eye:hover{color:var(--title);background:var(--card2)}.pw-eye:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;min-height:32px;cursor:pointer}
.check input{margin-top:2px;flex:none}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:var(--well);font-size:14px;line-height:1.45;border-left:3px solid var(--line2)}
.notice.ok{border-color:var(--green);background:var(--green-soft);color:var(--green-text)}
.notice.warn{border-color:var(--warn);background:var(--warn-soft);color:#F8D9B9}
.notice.err{border-color:var(--red);background:var(--red-soft);color:#FFD3CF}
.notice.info{border-color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--red-soft);border:1px solid var(--red-line);font-size:14px}
.progress{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--gold);border-radius:3px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line2);border-radius:12px;text-align:center}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}

/* Oggi (tavola A) */
.now{display:flex;flex-wrap:wrap;gap:24px;padding:24px}
.now>div{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:14px}
.now .vline{flex:0 0 1px;background:var(--line);align-self:stretch;padding:0}
.icon-tile{width:72px;height:72px;border-radius:12px;background:var(--chip);display:grid;place-items:center;flex:none}
.big-title{font:500 22px/1.25 var(--display);color:var(--title);overflow-wrap:anywhere}
.ring{width:72px;height:72px;border-radius:50%;flex:none;display:grid;place-items:center}
.ring>div{width:60px;height:60px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;line-height:1}
.stat-value{font:500 28px var(--display);color:var(--title)}
.stat-sub{color:var(--muted);font-size:13px}
.tl-wrap{overflow-x:auto;overflow-y:hidden;padding:6px 0}
.tl{min-width:640px;display:grid;grid-template-columns:76px 1fr;row-gap:10px;column-gap:12px;align-items:center}
.tl-axis{position:relative;height:16px;font:11px var(--mono);color:var(--dim)}
.tl-axis span{position:absolute;transform:translateX(-50%)}
.tl-track{position:relative;height:34px}
.tl-block{position:absolute;top:0;bottom:0;border-radius:6px;padding:0 10px;display:flex;align-items:center;font-size:12px;overflow:hidden;white-space:nowrap;background:#2C2620;border:1px solid var(--line2);color:#D6C6B0}
.tl-block.now-block{background:var(--gold-soft);border-color:#6E5228;color:#F4D9A6}
.tl-block.tv{background:var(--green-soft);border-color:var(--green-line);color:var(--green-text)}
.tl-now{position:absolute;top:-6px;width:2px;background:var(--green);z-index:2}
.tick{position:absolute;top:3px;width:4px;height:12px;border-radius:2px}
.zone-card{display:flex;flex-direction:column;gap:6px;padding:16px;text-decoration:none;color:inherit}
.zone-card.offline{border-color:#6A3A24}
.issue{padding:12px;border-radius:10px;background:var(--card2);display:flex;gap:10px}
.issue .t{color:var(--title);font-weight:500}
.logrow{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line3);font-size:13px;color:#D6C6B0}
.logrow:last-child{border-bottom:0}
.mobile-only{display:none}

/* Zona (tavola C) */
.zone-chips{display:flex;flex-wrap:wrap;gap:8px}
.zone-panel{padding:18px;display:flex;flex-direction:column;gap:12px}
.zone-grid-row{display:grid;grid-template-columns:minmax(0,1fr) 96px 64px;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line3)}
.zone-grid-row.head{border-top:0;padding-top:0}
.zone-grid-cell{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.sw:disabled{opacity:.4;cursor:not-allowed}
.zone-panel h2{font:600 17px var(--sans);color:var(--title)}
.box{padding:12px;border-radius:10px;background:var(--card2)}
.rot li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--card2)}
.num{width:22px;height:22px;border-radius:50%;background:#3A2E25;color:var(--text);display:grid;place-items:center;font:500 12px var(--mono);flex:none}
.num.gold{background:var(--gold);color:var(--gold-ink)}
dl.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
dl.facts dt{color:var(--muted)}dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.preview{width:100%;max-width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;display:block;background:#0B0907}
.seq-wrap{overflow-x:auto;padding-bottom:16px}
.seq{list-style:none;margin:0;padding:0;display:flex;gap:12px;min-width:min-content}
.seq li{flex:0 0 190px;background:var(--card2);border-radius:10px;overflow:hidden;border:1px solid var(--line2);cursor:grab}
.seq li.selected{border:2px solid var(--gold)}
.seq li.drag-over{outline:2px dashed var(--gold);outline-offset:2px}
.seq .thumb{position:relative;aspect-ratio:16/9;background:#0B0907;display:grid;place-items:center;overflow:hidden}
.seq .thumb img,.seq .thumb video{width:100%;height:100%;object-fit:cover;display:block}
.seq .thumb .num{position:absolute;left:8px;top:8px;background:var(--gold);color:var(--gold-ink)}
.seq .body{padding:10px;display:flex;flex-direction:column;gap:6px}
.seq .name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seq .body select,.seq .body input{min-height:34px;font-size:13px}
.seq-actions{display:flex;gap:4px}
.seq-actions button{min-height:32px;min-width:32px;padding:0 8px}
.seq-foot{margin:0 -20px -20px;padding:12px 20px;border-top:1px solid var(--line);background:#1E1A13;border-radius:0 0 var(--radius) var(--radius);display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.collage-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:6px}
.collage-pick label{display:flex;gap:6px;align-items:center;font-size:12px;overflow:hidden}

/* Palinsesto (tavola B, in palette scura) */
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted2)}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:middle}
.week{min-width:620px}
.week-row{display:grid;grid-template-columns:84px 1fr;column-gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line3)}
.week-row .day{font-weight:600;font-size:14px}
.week-row .day.today{color:var(--gold)}
.lane{position:relative;height:76px;border-radius:6px;overflow:hidden;background:repeating-linear-gradient(45deg,#1E1915 0 2px,#16120F 2px 6px)}
.lane .open{position:absolute;top:0;bottom:0;background:#1B1612;border-left:1px dashed var(--line2);border-right:1px dashed var(--line2)}
.lane .mblock{position:absolute;top:4px;height:28px;border-radius:5px;padding:0 8px;display:flex;align-items:center;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;background:#24324A;color:#C9DBF5;border:0;cursor:pointer;text-align:left}
.lane .mblock.sel{background:var(--blue);color:#0E1626;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--blue)}
.lane .mblock.outside{background:repeating-linear-gradient(135deg,#5A2420 0 6px,#4A1E1A 6px 12px);color:#FFD3CF}
.lane .mblock.off{opacity:.5}
.lane .spots{position:absolute;top:38px;height:10px}
.lane .tvbar{position:absolute;top:52px;height:18px;border-radius:4px;background:var(--green-soft);color:var(--green-text);font-size:11px;font-weight:600;padding:0 8px;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.lane .closed{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted2);gap:4px}
.lane .nowline{position:absolute;top:0;bottom:0;width:2px;background:#E2564C;z-index:3}
.editor{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px #0006}
.editor .eh{padding:18px 20px;border-bottom:1px solid var(--line3);display:flex;justify-content:space-between;gap:12px}
.editor .eb{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.editor .ef{padding:14px 20px;border-top:1px solid var(--line3);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.refresh-btn{color:var(--gold);border-color:#6E5228;background:var(--gold-soft)}.refresh-btn:hover{color:var(--gold-ink);background:var(--gold)}
.spin{display:inline-grid;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.src-list{max-height:220px;overflow:auto;border:1px solid var(--line2);border-radius:9px;margin-top:6px}
.src-list button{display:flex;width:100%;justify-content:space-between;gap:8px;background:transparent;border:0;border-bottom:1px solid var(--line3);padding:10px 12px;text-align:left;cursor:pointer;font-size:14px}
.src-list button[aria-pressed="true"]{background:var(--gold-soft);color:var(--title)}
.src-list button:hover{background:var(--card2)}

/* Configurazione guidata (tavola D, in palette scura) */
.wiz{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.wiz nav{flex:1 1 220px;min-width:0}
.wiz main{padding:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.steps a{display:flex;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none}
.steps a[aria-current="step"]{background:var(--card);border:1px solid var(--line);color:var(--title)}
.steps .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;font-weight:600;font-size:13px}
.steps .done .n{background:#2F6B47;border-color:#2F6B47;color:#fff}
.steps [aria-current="step"] .n{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.wiz-main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:26px}
.wiz-main h1{margin:6px 0 8px;font:500 42px/1.1 var(--display);color:var(--title)}
.sentence{margin:0;font:400 27px/1.7 var(--display);max-width:820px;color:var(--text)}
.pick{display:inline;font:inherit;color:var(--gold);background:#2E2214;border:0;border-bottom:2px solid var(--gold);border-radius:6px 6px 0 0;padding:0 6px;cursor:pointer}
.pick:hover{background:#3A2B18}
.wiz-aside{flex:1 1 260px;min-width:0;background:var(--card2);border-radius:18px;padding:22px}
.wiz-aside h2{margin:0 0 14px;font:500 21px var(--display);color:var(--title)}
.wiz-foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;max-width:820px;padding-top:12px;border-top:1px solid var(--line)}
.wiz-foot .btn,.wiz-head .btn{border-radius:999px}
.pop{position:absolute;z-index:40;background:var(--card);border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 40px #000a;padding:12px;min-width:220px;max-width:min(360px,calc(100vw - 32px));display:flex;flex-direction:column;gap:8px}
.pop .opt{display:flex;justify-content:space-between;width:100%;background:transparent;border:0;border-radius:8px;padding:9px 10px;text-align:left;cursor:pointer;font-size:15px}
.pop .opt:hover,.pop .opt[aria-pressed="true"]{background:var(--gold-soft);color:var(--title)}

/* Contenuti (tavola E) */
.drop{border:2px dashed var(--line2);border-radius:16px;padding:22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;background:#17120F}
.drop.over{border-color:var(--gold);background:var(--gold-soft)}
.media-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.media-card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.media-card .thumb{aspect-ratio:16/10;background:#2A221C;display:grid;place-items:center;overflow:hidden}
.media-card .thumb img,.media-card .thumb video{width:100%;height:100%;object-fit:cover;display:block}
.media-card .body{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.media-card .name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.media-card audio{width:100%;height:36px}
.use{font-size:12px;color:var(--green-text)}.use.spot{color:var(--gold2)}.use.none{color:var(--dim)}

/* Registro */
.log-day{padding:8px 0 4px;color:var(--gold);font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase}
.log-item{display:grid;grid-template-columns:76px 86px minmax(0,1fr);gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line3);font-size:14px}
.lvl{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.05em;border-radius:99px;padding:2px 8px;justify-self:start;background:var(--card2);color:var(--muted)}
.lvl.success{background:var(--green-soft);color:var(--green-text)}.lvl.warning{background:var(--warn-soft);color:var(--warn)}.lvl.error{background:var(--red-soft);color:var(--red)}

/* Storico spot: dashboard */
.filters-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.filters-row .inp{min-height:40px;width:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:4px;padding:16px 18px}
.kpi .v{font:600 30px/1.1 var(--sans);color:var(--title)}
.kpi .v small{font:500 14px var(--sans);color:var(--muted)}
.hero-kpi .v{font-size:52px}
.chart-cap{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chart-cap h2{margin:0}
.cols{display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:8px}
.cols .yax{position:relative;height:170px;font:11px var(--mono);color:var(--dim);text-align:right}
.cols .yax span{position:absolute;right:0;transform:translateY(50%)}
.cols .plot{position:relative;height:170px;border-bottom:1px solid var(--line2)}
.cols .grid{position:absolute;left:0;right:0;height:1px;background:var(--line3)}
.cols .bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px}
.cols .slot{flex:1 1 0;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;min-width:0;outline:none}
.cols .slot:hover,.cols .slot:focus-visible{background:#ffffff08;border-radius:4px 4px 0 0}
.cols .bar{width:100%;max-width:24px;background:var(--gold);border-radius:4px 4px 0 0;min-height:0}
.cols .bar.dim{background:#8A6A33}
.cols .cap-label{position:absolute;bottom:calc(var(--h) + 4px);font:600 11px var(--sans);color:var(--text);white-space:nowrap}
.cols .xax{grid-column:2;display:flex;gap:2px;font:11px var(--mono);color:var(--dim);margin-top:6px}
.cols .xax span{flex:1 1 0;text-align:center;min-width:0;overflow:visible;white-space:nowrap}
.hbars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.hbars li{display:grid;grid-template-columns:minmax(90px,34%) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.hbars .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbars .track{height:14px;position:relative}
.hbars .fill{height:14px;background:var(--gold);border-radius:0 4px 4px 0;max-width:100%}
.hbars .val{font:600 13px var(--sans);color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.hbars .val small{color:var(--muted);font-weight:500}
.status{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--sans);border-radius:99px;padding:2px 9px;white-space:nowrap}
.status.played{background:var(--green-soft);color:var(--green-text)}.status.stopped{background:var(--warn-soft);color:var(--warn)}.status.failed{background:var(--red-soft);color:var(--red)}
.table-wrap{overflow-x:auto}
table.hist{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
table.hist th{text-align:left;font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
table.hist td{padding:10px;border-bottom:1px solid var(--line3);vertical-align:top}
table.hist td.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px;white-space:nowrap}
.tip{position:fixed;z-index:60;pointer-events:none;background:#0E0B09;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.4;color:var(--text);box-shadow:0 10px 26px #000a;max-width:260px;white-space:pre-line}

/* Barra di salvataggio, toast, navigazione telefono (tavola E) */
.savebar{position:fixed;left:calc(248px + 50% - 124px);transform:translateX(-50%);bottom:18px;z-index:30;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#2A1F14;border:1px solid var(--gold);border-radius:14px;padding:10px 12px 10px 16px;box-shadow:0 14px 40px #000c;max-width:calc(100vw - 32px)}
.savebar b{color:#F8DFB5;font-weight:600}
.toast{position:fixed;right:18px;bottom:18px;z-index:50;max-width:400px;background:#282019;border:1px solid #80603a;border-radius:12px;padding:12px 16px;box-shadow:0 14px 40px #000c;opacity:0;pointer-events:none;transform:translateY(8px);transition:.2s}
.toast.show{opacity:1;transform:none}
.toast.bad{border-color:var(--red)}
.tabbar{display:none}
.ha-error{background:var(--red-soft);border-bottom:1px solid var(--red-line);color:#FFD3CF;padding:10px 28px;font-size:14px}

@media(max-width:1100px){.side{width:220px}.savebar{left:calc(220px + 50% - 110px)}}
@media(max-width:820px){
  body{font-size:16px}
  .side{display:none}
  .top{justify-content:space-between;padding:12px 16px}
  .top .mobile-brand{display:flex;align-items:center;gap:8px;font:600 16px var(--display);color:var(--title)}
  .top .engine,.top .saved-state{display:none}
  main{padding:18px 16px calc(150px + env(safe-area-inset-bottom))}
  .page-head h1{font-size:32px}
  .card{padding:16px;border-radius:20px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;border-top:1px solid #2B2521;background:#16120F;padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;color:#A99A88;text-decoration:none;font-size:12px;font-weight:700}
  .tab[aria-current="page"]{color:var(--gold)}
  .savebar{left:12px;right:12px;transform:none;bottom:calc(76px + env(safe-area-inset-bottom));max-width:none}
  .savebar b{flex:1 1 100%}
  .toast{left:12px;right:12px;bottom:calc(140px + env(safe-area-inset-bottom));max-width:none}
  .desktop-only{display:none!important}
  .mobile-only{display:flex}
  .btn{min-height:52px;border-radius:14px}
  .btn-sm{min-height:40px}
  .sentence{font-size:22px}
  .wiz-main h1{font-size:32px}
  .now{padding:16px;gap:16px}.now .vline{display:none}
  .seq{flex-direction:column}
  .seq li{flex:1 1 auto;display:grid;grid-template-columns:104px minmax(0,1fr);cursor:default}
  .seq .thumb{aspect-ratio:16/10}
  .seq-foot{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));margin:16px -16px -16px;z-index:4}
  .log-item{grid-template-columns:64px minmax(0,1fr)}.log-item .lvl{grid-column:2}.log-item .msg{grid-column:1/-1}
  .media-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-kpi .v{font-size:44px}
  .filters-row .field{flex:1 1 100%!important}.filters-row .inp{width:100%}
  .kpis .hero-kpi{grid-column:1/-1}
  .cols .yax,.cols .plot{height:140px}
  .upload-fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:15;border-radius:999px;box-shadow:0 10px 30px #000a}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div class="app">
  <nav class="side" id="side" aria-label="Zone e sezioni"></nav>
  <div class="main-wrap">
    <header class="top" id="top"></header>
    <div class="ha-error" id="haError" role="alert" hidden></div>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sezioni"></nav>
<div class="savebar" id="savebar" role="region" aria-label="Modifiche" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="pop" id="pop" role="dialog" hidden></div>
<div class="tip" id="tip" role="tooltip" hidden></div>
<script>
'use strict';
/* ==========================================================================
   Stato e utilità
   ========================================================================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const S={hist:{period:'7',limit:50},state:null,draft:null,saved:'',route:'oggi',param:'',lang:'it',sel:{},confirm:null,filter:{media:'all',log:'all',q:''},expert:false,uploading:''};
const DAYS_IT=['Lu','Ma','Me','Gi','Ve','Sa','Do'],DAYS_DE=['Mo','Di','Mi','Do','Fr','Sa','So'];
const DAYS_LONG_IT=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const DAYS_LONG_DE=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const MONTHS_IT=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const MONTHS_DE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const EXT={audio:['mp3','wav','m4a','aac','ogg','flac'],image:['jpg','jpeg','png','webp','gif'],video:['mp4','m4v','mov','webm','mkv']};
const EFFECTS=[['fade','Dissolvenza morbida'],['ken_burns','Ken Burns diagonale'],['ken_burns_reverse','Ken Burns inverso'],['zoom_in','Zoom cinematografico avanti'],['zoom_out','Zoom cinematografico indietro'],['pan_right','Panoramica verso destra'],['pan_left','Panoramica verso sinistra'],['pan_down','Panoramica verso il basso'],['pan_up','Panoramica verso l’alto'],['black_white','Bianco e nero'],['none','Nessun effetto']];
const FITS=[['smart','16:9 completo, sfondo sfocato'],['cover','16:9 pieno, ritaglio centrato'],['contain','Immagine intera con bordi neri']];
const LAYOUTS=[['grid','Griglia automatica'],['hero','Foto principale + laterali'],['strip','Foto affiancate']];

function days(){return S.lang==='de'?DAYS_DE:DAYS_IT}
function L(text){if(S.lang!=='de')return text;return DE.get(text)??text}
function Lf(text,...values){let out=L(text);values.forEach((v,i)=>{out=out.replace('{'+i+'}',v)});return out}
function toMin(v){const m=/^(\d{1,2}):(\d{2})/.exec(String(v||''));return m?Math.min(1440,(+m[1])*60+(+m[2])):0}
function hhmm(min){min=((Math.round(min)%1440)+1440)%1440;return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0')}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60}
function todayIdx(){return (new Date().getDay()+6)%7}
function normClock(v){const s=String(v||'').replace(/[^0-9:]/g,'');let h,m;if(s.includes(':')){[h,m]=s.split(':')}else if(s.length<=2){h=s;m='0'}else{h=s.slice(0,-2);m=s.slice(-2)}h=Math.min(23,+h||0);m=Math.min(59,+m||0);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function prettyName(name){return String(name||'').replace(/\.[a-z0-9]{2,4}$/i,'').replace(/^Carellas_Ristorante_/,'').replace(/^Demo_Carellas_/,'').replace(/_/g,' ')}
function mediaUrl(name){return 'media/'+encodeURIComponent(name)}
function sizeLabel(n){n=+n||0;return n>1e9?(n/1e9).toFixed(1)+' GB':n>1e6?(n/1e6).toFixed(1)+' MB':Math.max(1,Math.round(n/1e3))+' KB'}
function durLabel(s){s=Math.round(+s||0);return s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):s+' s'}
function daysText(list){
  const d=[...new Set(list||[])].sort((a,b)=>a-b);
  if(!d.length)return L('nessun giorno');
  if(d.length===7)return L('tutti i giorni');
  if(d.join()==='0,1,2,3,4')return L('dal lunedì al venerdì');
  if(d.join()==='5,6')return L('nel fine settimana');
  const contiguous=d.every((v,i)=>!i||v===d[i-1]+1);
  const long=S.lang==='de'?DAYS_LONG_DE:DAYS_LONG_IT;
  if(contiguous&&d.length>2)return Lf('da {0} a {1}',long[d[0]].toLowerCase(),long[d.at(-1)].toLowerCase());
  return d.map(i=>days()[i]).join(', ');
}
function icon(name,size=18){
  const p={
    grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    live:'<circle cx="12" cy="12" r="3"/><path d="M6.3 6.3a8 8 0 0 0 0 11.4M17.7 6.3a8 8 0 0 1 0 11.4"/>',
    cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
    image:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/>',
    list:'<path d="M4 6h16M4 12h16M4 18h10"/>',
    menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
    gear:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    play:'<path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/>',
    pause:'<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>',
    stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',
    music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    speaker:'<rect x="6" y="2" width="12" height="20" rx="3"/><circle cx="12" cy="14" r="3.5"/><circle cx="12" cy="6.5" r="1"/>',
    tv:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/>',
    check:'<path d="M20 6 9 17l-5-5"/>',
    warn:'<path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5M12 18h.01"/>',
    refresh:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    up:'<path d="M12 19V5M5 12l7-7 7 7"/>',
    left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',
    close:'<path d="M18 6 6 18M6 6l12 12"/>',
    chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    eyeoff:'<path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
    wand:'<path d="m15 4 5 5L9 20H4v-5z"/><path d="m13 6 5 5"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    wave:'<path d="M3 12v0M7 8v8M11 4v16M15 9v6M19 6v12"/>',
    drag:'<circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/>'
  }[name]||'';
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}
function sw(checked,act,label,extra=''){return `<button class="sw" type="button" role="switch" aria-checked="${checked?'true':'false'}" aria-label="${esc(label)}" data-act="${act}" ${extra}><span class="knob"></span></button>`}
function toast(msg,bad=false){const t=$('toast');t.textContent=L(msg);t.className='toast show'+(bad?' bad':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.className='toast',4000)}

/* ==========================================================================
   Comunicazione con il server (API esistenti)
   ========================================================================== */
async function request(path,options={}){
  const r=await fetch(path,options),raw=await r.text();let j={};
  try{j=raw?JSON.parse(raw):{}}catch(e){throw new Error(`HTTP ${r.status}: ${raw.slice(0,120)||L('risposta non valida')}`)}
  if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);return j;
}
function post(path,body={}){return request(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
async function command(path,body,okMessage){try{const r=await post(path,body);if(okMessage)toast(okMessage);setTimeout(()=>load(),700);return r}catch(e){toast(e.message,true);return null}}

function isDirty(){return S.draft&&JSON.stringify(S.draft)!==S.saved}
async function load(force=false){
  try{
    const st=await request('api/state?ts='+Date.now(),{cache:'no-store'});
    S.state=st;
    // Mentre si modifica (menu aperto, campo attivo) la bozza non va sostituita.
    if(!isDirty()&&(!busy()||!S.draft)){S.draft=clone(st.config);S.saved=JSON.stringify(S.draft)}
    if(!S.langSet){S.lang=st.config.language==='de'?'de':'it';S.langSet=true}
    // Ridisegna solo se qualcosa è cambiato davvero: il conto alla rovescia si aggiorna a parte.
    const sig=JSON.stringify({...st,runtime:{...st.runtime,next_spot_in_seconds:null}});
    if(S.route==='storico'&&Date.now()-(S.hist.at||0)>30000&&!S.hist.loading)loadHistory();
    if(sig===S.sig&&!force){updateLive();return}
    S.sig=sig;
    if(!busy())render();else S.pending=true;
  }catch(e){if(!S.state){$('main').innerHTML=`<div class="notice err">${esc(L('Impossibile caricare il pannello'))}: ${esc(e.message)}</div>`}}
}
function busy(){
  const a=document.activeElement;
  if([...document.querySelectorAll('audio,video[controls]')].some(m=>!m.paused))return true;
  return !$('pop').hidden||S.dragging||(a&&a.closest&&a.closest('main')&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&a.type!=='range'&&a.type!=='checkbox');
}
async function save(){
  try{
    validateDraft();
    const result=await post('api/config',S.draft);
    S.state.config=result.config;S.draft=clone(result.config);S.saved=JSON.stringify(S.draft);
    toast(result.rebuilt_channels?.length?'Salvato. Le TV ricevono la nuova sequenza appena è pronta.':'Modifiche salvate');
    if(result.rebuilt_channels?.length)monitorBuild(result.rebuilt_channels);
    await load();return result;
  }catch(e){toast(e.message,true);return null}
}
function discard(){S.draft=JSON.parse(S.saved);S.confirm=null;render();toast('Modifiche annullate')}
function validateDraft(){
  for(const u of S.draft.browser_player?.users||[]){
    if(!/^[a-zA-Z0-9_.-]{3,40}$/.test(u.username||''))throw new Error(L('Nome utente TV: da 3 a 40 lettere, numeri, punto, trattino o underscore'));
    if(!u.password_hash&&!(u.password||'').length)throw new Error(Lf('Imposta una password per l’utente {0}',u.username));
    if(u.password&&u.password.length<6)throw new Error(L('La password deve contenere almeno 6 caratteri'));
    if(!u.channel_id)throw new Error(Lf('Scegli il canale per l’utente {0}',u.username));
  }
}
async function monitorBuild(ids){
  const token=(monitorBuild.token=(monitorBuild.token||0)+1);
  for(let i=0;i<300&&token===monitorBuild.token;i++){
    await new Promise(r=>setTimeout(r,2000));
    try{
      const r=await request('api/iptv/status?ts='+Date.now(),{cache:'no-store'});
      S.state.runtime.iptv_status=r.channels||{};if(!busy())render();
      const st=ids.map(id=>r.channels?.[id]||{});
      if(st.some(s=>s.state==='error')){toast(L('Errore nella generazione della sequenza')+': '+buildError(st.find(s=>s.state==='error').message),true);return}
      if(st.every(s=>s.state==='ready')){toast('Nuova sequenza generata e inviata alle TV');return}
    }catch(e){}
  }
}

function sonosStatus(id){const s=sonosById(id);if(!s||!s.available)return'off';if(s.state==='playing'||s.state==='buffering')return rt().spot_playing&&(cfg().audio.players||[]).includes(id)?'spot':'on';return'idle'}

function zones(){
  const saved=cfg().zones||[];

  const used=new Set(),ids=new Set();

  });
  const rest=channels().filter(c=>!used.has(c.id));
  if(rest.length)list.push({id:uniqueId('schermi'),name:L('Schermi'),players:[],iptv_channels:rest.map(c=>c.id),main_tv:false,virtual:true});

// Sonos che adesso dovrebbero suonare: quelli della fascia in corso (o della musica senza fasce).

// Fascia in corso ma Sonos fermi (per esempio dopo "Ferma tutto" o uno stop dall'app Sonos).

function zoneMeta(z){

function windowsOf(rows,day){
  const out=[];
  (rows||[]).filter(r=>r.enabled!==false).forEach(r=>{
    const a=toMin(r.start),b=toMin(r.end);
    if((r.days||[]).includes(day)){if(a<b)out.push([a,b]);else out.push([a,1440])}
    if(a>=b&&(r.days||[]).includes((day+6)%7))out.push([0,b]);
  });
  out.sort((x,y)=>x[0]-y[0]);
  return out.reduce((m,c)=>{const l=m.at(-1);if(l&&c[0]<=l[1])l[1]=Math.max(l[1],c[1]);else m.push([...c]);return m},[]);
}
function openWindows(day){return windowsOf(cfg().music.schedule,day)}
function slotDuration(s){return +s.duration_minutes||((toMin(s.end)-toMin(s.start)+1440)%1440)||60}
// Con il campo orologio ancora attivo si aggiorna solo la barra: la pagina si ridisegna all'uscita dal campo.
function timeChanged(t){if(document.activeElement===t){S.pending=true;renderSavebar();renderTop()}else render()}
// Orario di una fascia: mentre si scrive il controllo aspetta l'uscita dal campo (gli orari a metà non contano).
function slotTimeChanged(t,before,s,field){
  if(document.activeElement===t){S.slotGuard=S.slotGuard&&S.slotGuard.s===s?{...S.slotGuard,field}:{before,s,field};timeChanged(t);return}
  keepSlotsApart(before,s,field);render();
}
function slotIntervals(s){
  const a=toMin(s.start),b=a+slotDuration(s),out=[];
  (s.days||[]).forEach(d=>{if(b<=1440)out.push([d,a,b]);else{out.push([d,a,1440]);out.push([(d+1)%7,0,b-1440])}});
  return out;
}
// Stesso controllo del server (validate_music_slots): due fasce attive non possono suonare insieme sugli stessi Sonos.
function slotConflicts(slots=cfg().music.slots){
  const c=cfg(),list=(slots||[]).filter(s=>s.enabled!==false),out=[];
  const playersOf=s=>(s.players||[]).length?s.players:(c.music.players||[]);
  list.forEach((x,i)=>list.slice(i+1).forEach(y=>{
    const shared=playersOf(x).filter(p=>playersOf(y).includes(p));if(!shared.length)return;
    for(const[d1,a1,b1]of slotIntervals(x))for(const[d2,a2,b2]of slotIntervals(y))
      if(d1===d2&&Math.max(a1,a2)<Math.min(b1,b2)){out.push({a:x,b:y,day:d1,from:Math.max(a1,a2),to:Math.min(b1,b2),players:shared});return}
  }));
  return out;
}
function conflictText(k){
  const long=S.lang==='de'?DAYS_LONG_DE:DAYS_LONG_IT;
  return Lf('{0} dalle {1} alle {2} su {3}. Un Sonos suona una sola musica alla volta: cambia l’orario, i giorni o le casse di una delle due.',long[k.day],hhmm(k.from),hhmm(k.to),namesOf(k.players));
}
function slotsSnap(){return JSON.stringify(cfg().music.slots||[])}
// Fine dell'orario di apertura in cui inizia la fascia (la più presto tra i suoi giorni); senza orari generali è mezzanotte.
function slotCloseTime(s){
  const a=toMin(s.start);let close=1440;
  if(!(cfg().music.schedule||[]).length)return close;
  (s.days||[]).forEach(d=>{const w=openWindows(d).find(([x,y])=>a>=x&&a<y);if(w)close=Math.min(close,w[1])});
  return close;
}
// Dopo ogni modifica di una fascia: l'orario scelto resta com'è e sono le altre fasce degli stessi Sonos ad adattarsi.
// - una fascia che inizia prima finisce dove comincia quella modificata;
// - le fasce che vengono dopo slittano in avanti a catena, con la stessa durata, fino all'orario di chiusura
//   (l'ultima viene accorciata per finire alla chiusura).
// Se una fascia resterebbe sotto i 15 minuti, o per giorni e casse, la modifica è annullata con la spiegazione.
// before = slotsSnap() preso prima della modifica; field = 'start' o 'end' per gli orari, altrimenti nulla.
function keepSlotsApart(before,s,field){
  const prev=slotConflicts(JSON.parse(before)).length;
  if(slotConflicts().length<=prev)return true;
  let reason='';
  if(s&&(field==='start'||field==='end')){
    const fixed=new Set([s]),moved=[];
    for(let i=0;i<50;i++){
      const k=slotConflicts().find(k=>fixed.has(k.a)!==fixed.has(k.b));if(!k)break;
      const anchor=fixed.has(k.a)?k.a:k.b,o=anchor===k.a?k.b:k.a;
      const as=toMin(anchor.start),ae=as+slotDuration(anchor),os=toMin(o.start);
      if(os<as){
        if(as-os<15){reason=Lf('{0} resterebbe più corta di 15 minuti.',slotTitle(o));break}
        o.duration_minutes=as-os;o.end=slotEnd(o);
      }else{
        const close=slotCloseTime(o);
        if(ae>close-15){reason=Lf('{0} non ci sta più prima della chiusura delle {1}.',slotTitle(o),hhmm(close));break}
        o.start=hhmm(ae);o.duration_minutes=Math.min(slotDuration(o),close-ae);o.end=slotEnd(o);
      }
      fixed.add(o);if(!moved.includes(o))moved.push(o);
    }
    if(!reason&&slotConflicts().length<=prev){
      if(moved.length)toast(Lf('Fasce adattate: {0}',moved.map(o=>slotTitle(o)+' '+o.start+'–'+slotEnd(o)).join(', ')));
      return true;
    }
  }
  const k=slotConflicts().find(k=>!s||k.a===s||k.b===s)||slotConflicts()[0];
  cfg().music.slots=JSON.parse(before);
  toast(reason?Lf('Modifica annullata: {0}',reason):Lf('Modifica annullata: {0} e {1} si accavallerebbero. {2}',slotTitle(k.a),slotTitle(k.b),conflictText(k)),true);
  return false;
}
// Nuovo blocco: primo orario libero nell'orario di apertura, senza accavallarsi con le altre fasce degli stessi Sonos.
function placeFreeSlot(s,open){
  const others=(cfg().music.slots||[]).filter(o=>o!==s&&o.enabled!==false);
  const cands=[open[0],...others.map(o=>toMin(o.start)+slotDuration(o))].filter(x=>x>=open[0]&&x<open[1]).sort((a,b)=>a-b);
  for(const c of cands){
    const next=Math.min(open[1],...others.map(o=>toMin(o.start)).filter(x=>x>c));
    if(next-c<15)continue;
    s.start=hhmm(c);s.duration_minutes=Math.min(240,next-c);s.end=slotEnd(s);
    if(!slotConflicts().some(k=>k.a===s||k.b===s))return true;
  }
  return false;
}
function slotEnd(s){return hhmm(toMin(s.start)+slotDuration(s))}
function slotsOn(day){return (cfg().music.slots||[]).filter(s=>(s.days||[]).includes(day)).sort((a,b)=>toMin(a.start)-toMin(b.start))}
function slotOutside(s){
  const general=cfg().music.schedule||[];if(!general.length)return[];
  const out=[];
  (s.days||[]).forEach(d=>{const a=toMin(s.start),b=Math.min(1440,a+slotDuration(s));const w=openWindows(d);let c=a;for(const[x,y]of w){if(y<=c)continue;if(x>=b)break;if(x>c)out.push([d,c,Math.min(x,b)]);c=Math.max(c,y);if(c>=b)break}if(c<b)out.push([d,c,b])});
  return out;
}
function currentSlot(){const id=rt().music_slot_id;return (cfg().music.slots||[]).find(s=>String(s.id)===String(id))}
function nextSlotAfter(day,minute){return slotsOn(day).find(s=>toMin(s.start)>minute)}
function sonosSources(selected){

function dateLabel(){
  const d=new Date(),long=S.lang==='de'?DAYS_LONG_DE:DAYS_LONG_IT,months=S.lang==='de'?MONTHS_DE:MONTHS_IT;
  const w=openWindows(todayIdx());
  const open=!(cfg().music.schedule||[]).length?L('orari di apertura non impostati'):w.length?Lf('aperto {0}',w.map(([a,b])=>hhmm(a)+'–'+hhmm(b)).join(', ')):L('chiuso oggi');
  return `${long[todayIdx()]} ${d.getDate()} ${months[d.getMonth()]} · ${open}`;

function dayRange(){
  const day=todayIdx(),edges=[...openWindows(day),...windowsOf(cfg().audio.schedule,day),...slotsOn(day).map(s=>[toMin(s.start),toMin(s.start)+slotDuration(s)]),...channels().flatMap(c=>windowsOf(c.schedule,day))];
  if(!edges.length)return[8*60,24*60];
  let a=Math.min(...edges.map(e=>e[0])),b=Math.max(...edges.map(e=>e[1]));
  a=Math.floor(a/60)*60;b=Math.min(1440,Math.ceil(b/60)*60);if(b-a<240)b=Math.min(1440,a+240);return[a,b];
}
function nextSpotInfo(){
  const r=rt(),a=cfg().audio,waiting={disabled:'Pubblicità automatica spenta',no_ads:'Nessuno spot scelto',paused:'Pubblicità in pausa',outside_schedule:'Fuori dall’orario degli spot',daily_limit:'Limite giornaliero raggiunto',no_music:'In attesa che parta la musica'}[r.audio_waiting];
  const secs=r.next_spot_in_seconds,interval=(+a.interval_minutes||30)*60;
  return{name:r.next_spot,secs,waiting:waiting?L(waiting):'',pct:secs==null?0:Math.max(0,Math.min(100,100-secs/interval*100)),at:secs==null?'':hhmm(nowMin()+secs/60)};
}
function ringHtml(spot){return `<div class="ring" style="background:conic-gradient(var(--gold) 0 ${spot.pct}%,var(--track) ${spot.pct}% 100%)"><div><div><div class="mono" style="font-size:20px;color:var(--title)">${spot.secs==null?'—':spot.secs>=60?Math.ceil(spot.secs/60):spot.secs}</div><div class="tiny muted">${spot.secs!=null&&spot.secs<60?'s':'min'}</div></div></div></div>`}

  const rows=users.map((u,i)=>`<li class="row" style="justify-content:space-between;gap:10px"><span class="row" style="gap:8px">${icon('tv',16)}<strong>${esc(u.username)}</strong>${u.enabled===false?`<span class="tiny muted">${esc(L('accesso disattivato'))}</span>`:''}</span><select class="inp" style="width:auto;min-height:36px" data-bind="browser_player.users.${i}.channel_id" aria-label="${esc(Lf('Canale mostrato da {0}',u.username))}">${channels().map(c=>`<option value="${esc(c.id)}" ${c.id===u.channel_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>${u.channel_id&&u.channel_id!==ch.id?`<a class="btn btn-ghost btn-sm" href="#/canale/${encodeURIComponent(u.channel_id)}">${esc(L('Apri'))}</a>`:''}</li>`).join('');
  return `<section class="card col" style="gap:12px"><div class="card-head"><div><h2 style="font:600 17px var(--sans)">${esc(L('Su quali TV va questo canale'))}</h2><div class="small muted">${esc(here.length?Lf('Lo mostrano: {0}',here.join(', ')):L('Nessuna TV mostra ancora questo canale.'))}</div></div><button class="btn btn-ghost btn-sm" type="button" data-act="tv-add-here" data-v="${esc(ch.id)}">${icon('plus',14)}${esc(L('Aggiungi una TV'))}</button></div>
    ${users.length?`<ul class="list" style="gap:8px">${rows}</ul>`:''}
    <div class="small muted">${esc(L('Ogni TV accede al Player con il suo utente e mostra il canale scelto qui.'))} <a href="#/impostazioni/utenti">${esc(L('Password e accessi'))}</a></div></section>`;
}
// Pagina di un canale TV (#/canale/<id>): si può riempire e rinominare anche quando il canale non è in una zona.
function pageCanale(){
  const ch=channelById(S.param);
  if(!ch)return `<div class="notice warn">${esc(L('Canale non trovato.'))} <a href="#/impostazioni/canali">${esc(L('Torna ai canali'))}</a></div>`;
  const i=channels().indexOf(ch),saved=cfg().zones||[],z=zones().find(z=>(z.iptv_channels||[]).includes(ch.id));
  const zoneSel=saved.length?`<label class="field"><span>${esc(L('Zona'))}</span><select class="inp" data-channel-zone="${esc(ch.id)}"><option value="">${esc(L('— Nessuna zona —'))}</option>${saved.map(zz=>`<option value="${esc(zz.id)}" ${z&&z.id===zz.id?'selected':''}>${esc(zz.name)}</option>`).join('')}</select></label>`:'';
  // Riquadro delle TV e menu sullo schermo arrivano da PR separate: si mostrano quando sono presenti.
  return `<div class="page-head"><div><div class="label">${esc(L('Canale TV'))}</div><h1>${esc(ch.name)}</h1></div><a class="btn btn-ghost" href="#/impostazioni/canali">${esc(L('Tutti i canali'))}</a></div>
    <section class="card col" style="gap:12px"><div class="row" style="justify-content:space-between"><h2 style="font:600 17px var(--sans)">${esc(L('Nome e zona'))}</h2>${sw(ch.enabled,'channel-enabled',Lf('Schermo attivo in {0}',ch.name),`data-v="${esc(ch.id)}"`)}</div>
      <div class="row"><label class="field"><span>${esc(L('Nome del canale'))}</span><input class="inp" value="${esc(ch.name)}" maxlength="60" data-bind="iptv.channels.${i}.name"></label>${zoneSel}</div></section>
    ${typeof tvTargets==='function'?tvTargets(ch):''}
    ${sequenceEditor(ch)}
    ${typeof menuEditor==='function'?menuEditor(ch):''}
    <section class="card col">${channelAdvanced(ch)}</section>`;
}

function powerOptions(sel){return `<option value="">${esc(L('— Nessuna —'))}</option>`+(S.state.power_entities||[]).map(e=>`<option value="${esc(e.entity_id)}" ${e.entity_id===sel?'selected':''}>${esc(e.name)} (${esc(e.entity_id)})</option>`).join('')}
function tvModeLabel(m){return L({lan_screen:'Smart TV via browser e LAN',dlna:'DLNA / DMR con accensione e spegnimento',media_player:'TV integrata in Home Assistant'}[m]||m)}
// Miniatura di un contenuto dello schermo: foto, fotogramma del video o primo scatto del collage.
function mediaThumb(it){
  if(it.kind==='video')return `<video src="${esc(mediaUrl(it.name))}#t=0.5" muted preload="metadata" playsinline></video>`;
  const name=it.kind==='collage'?(it.images||[])[0]:it.name;
  return name?`<img src="${esc(mediaUrl(name))}" alt="">`:icon('tv',28);
}
function mainTvPreview(){
  const it=(cfg().tv.playlist||[])[0];
  if(!it)return `<div class="preview" style="display:grid;place-items:center;color:var(--muted)">${icon('tv',34)}</div>`;
  return it.kind==='video'?`<video class="preview" src="${esc(mediaUrl(it.name))}#t=0.5" muted preload="metadata" playsinline aria-label="${esc(L('Anteprima schermo principale'))}"></video>`:`<img class="preview" src="${esc(mediaUrl(it.name))}" alt="${esc(L('Anteprima schermo principale')+': '+prettyName(it.name))}">`;
}

/* ==========================================================================
   Palinsesto (tavola B)
   ========================================================================== */
function pagePalinsesto(){
  const c=cfg(),day=todayIdx(),now=nowMin(),H0=c.music.schedule?.length||c.music.slots?.length?Math.min(8*60,...(c.music.slots||[]).map(s=>Math.floor(toMin(s.start)/60)*60),...(c.music.schedule||[]).map(r=>Math.floor(toMin(r.start)/60)*60)):8*60,H1=24*60;
  const pos=m=>((Math.max(H0,Math.min(H1,m))-H0)/(H1-H0)*100).toFixed(2)+'%',span=(a,b)=>((Math.min(H1,b)-Math.max(H0,a))/(H1-H0)*100).toFixed(2)+'%';
  if(S.param&&S.param!==S.sel.slotParam){S.sel.slot=S.param;S.sel.slotParam=S.param;S.sel.rule=false}
  const zoneFilter=S.sel.zoneFilter||'',zf=zoneFilter&&zoneById(zoneFilter);
  const conf=slotConflicts(),clash=new Set(conf.flatMap(k=>[k.a.id,k.b.id]));
  const view=S.sel.view||'week';
  const dayList=view==='day'?[day]:[0,1,2,3,4,5,6];
  const long=S.lang==='de'?DAYS_LONG_DE:DAYS_LONG_IT;
  const hours=[];for(let h=H0;h<=H1;h+=120)hours.push(h);
  const audioWins=d=>c.audio.enabled?(c.audio.schedule?.length?windowsOf(c.audio.schedule,d):openWindows(d).length?openWindows(d):[[H0,H1]]):[];
  const rows=dayList.map(d=>{
    const open=openWindows(d),general=(c.music.schedule||[]).length;
    const slots=slotsOn(d).filter(s=>!zf||(s.players||[]).some(p=>(zf.players||[]).includes(p)));
    const tv=channels().filter(ch=>!zf||(zf.iptv_channels||[]).includes(ch.id)).flatMap(ch=>windowsOf(ch.schedule,d).map(w=>[...w,ch.name]));
    const closed=general&&!open.length;
    const date=new Date();date.setDate(date.getDate()+d-day);
    return `<div class="week-row"><div><div class="day ${d===day?'today':''}">${esc(long[d])}</div><div class="mono tiny muted">${date.getDate()}/${date.getMonth()+1}</div></div>
      <div class="lane">${general?open.map(([a,b])=>`<div class="open" style="left:${pos(a)};width:${span(a,b)}"></div>`).join(''):`<div class="open" style="left:0;width:100%"></div>`}
      ${closed?`<div class="closed">${esc(L('Chiuso'))} · <button class="btn-link small" type="button" data-act="add-open" data-v="${d}">${esc(L('Aggiungi orario di apertura'))}</button></div>`:''}
      ${slots.map(s=>{const a=toMin(s.start),b=a+slotDuration(s),out=slotOutside(s).some(x=>x[0]===d);return `<button type="button" class="mblock ${S.sel.slot===s.id?'sel':''} ${out?'outside':''} ${clash.has(s.id)?'clash':''} ${s.enabled===false?'off':''}" style="left:${pos(a)};width:calc(${span(a,b)} - 3px)" data-act="slot-open" data-v="${esc(s.id)}" title="${esc(slotTitle(s)+' · '+s.start+'–'+slotEnd(s))}">${esc(slotTitle(s))}</button>`}).join('')}
      ${audioWins(d).map(([a,b])=>`<div class="spots" title="${esc(Lf('1 spot ogni {0} minuti',c.audio.interval_minutes))}" style="left:${pos(a)};width:${span(a,b)};background:repeating-linear-gradient(90deg,#C46A12 0 3px,transparent 3px ${Math.max(1,(+c.audio.interval_minutes||30)/Math.max(1,b-a)*100).toFixed(2)}%)"></div>`).join('')}
      ${tv.map(([a,b,n])=>`<div class="tvbar" style="left:${pos(a)};width:${span(a,b)}">${esc(n)}</div>`).join('')}
      ${d===day&&now>=H0&&now<=H1?`<div class="nowline" style="left:${pos(now)}"></div>`:''}</div></div>`}).join('');
  const rot=(c.audio.ads||[]).map(prettyName).join(' → ')||L('nessuno spot');
  const editor=S.sel.rule?ruleEditor():S.sel.openHours?openHoursEditor():S.sel.slot?slotEditor():`<div class="editor"><div class="eb"><div><div class="label" style="color:var(--blue)">${esc(L('Palinsesto'))}</div><h2 style="margin:2px 0 6px;font:600 20px var(--sans)">${esc(L('Settimana tipo'))}</h2><p class="small muted" style="margin:0">${esc(L('Il palinsesto si ripete ogni settimana. Tocca un blocco per modificarlo oppure crea un nuovo blocco musica.'))}</p></div><button class="btn btn-ghost" type="button" data-act="open-hours">${esc(L('Orari di apertura'))}</button><button class="btn btn-ghost" type="button" data-act="rule-open">${esc(L('Regola degli spot'))}</button><label class="check"><input type="checkbox" data-bind="music.enabled" ${c.music.enabled?'checked':''}> ${esc(L('Programmazione musicale automatica attiva'))}</label><label class="check"><input type="checkbox" data-bind="music.stop_at_end" ${c.music.stop_at_end?'checked':''}> ${esc(L('Ferma la musica quando nessuna fascia è attiva'))}</label></div></div>`;
  return `<div class="page-head" style="align-items:center"><h1>${esc(L('Palinsesto'))}</h1>
      <div class="seg" role="group" aria-label="${esc(L('Vista'))}"><button type="button" data-act="view" data-v="day" aria-pressed="${view==='day'}">${esc(L('Giorno'))}</button><button type="button" data-act="view" data-v="week" aria-pressed="${view==='week'}">${esc(L('Settimana'))}</button></div>
      <select class="inp" style="width:auto;min-height:40px" data-filter-zone aria-label="${esc(L('Filtra per zona'))}"><option value="">${esc(L('Tutte le zone'))}</option>${zones().map(z=>`<option value="${esc(z.id)}" ${z.id===zoneFilter?'selected':''}>${esc(z.name)}</option>`).join('')}</select>
      <div style="flex:1 1 auto"></div>
      <div class="legend desktop-only"><span><i style="background:#24324A"></i>${esc(L('Musica'))}</span><span><i style="background:repeating-linear-gradient(90deg,#C46A12 0 3px,transparent 3px 7px)"></i>${esc(L('Spot'))}</span><span><i style="background:var(--green-soft)"></i>${esc(L('Schermi'))}</span><span><i style="background:repeating-linear-gradient(45deg,#2A231D 0 2px,#16120F 2px 5px)"></i>${esc(L('Chiuso'))}</span></div>
      <button class="btn btn-primary" type="button" data-act="slot-new">${icon('plus',16)}${esc(L('Nuovo blocco'))}</button></div>
    ${conf.length?`<div class="notice warn col" style="align-items:flex-start;gap:6px;margin-bottom:14px"><strong>${esc(L('Queste fasce suonano insieme sugli stessi Sonos: finché non le correggi le modifiche non si possono salvare.'))}</strong>${conf.map(k=>`<div class="small"><button class="btn-link small" type="button" data-act="slot-open" data-v="${esc(k.a.id)}">${esc(slotTitle(k.a))}</button> + <button class="btn-link small" type="button" data-act="slot-open" data-v="${esc(k.b.id)}">${esc(slotTitle(k.b))}</button>: ${esc(conflictText(k))}</div>`).join('')}</div>`:''}
    <div class="split"><section class="card wide" aria-label="${esc(L('Settimana'))}" style="padding:16px 16px 8px;gap:0">
      <div class="tl-wrap"><div class="week"><div class="week-row" style="border-top:0;padding:0 0 6px"><div></div><div class="tl-axis">${hours.map(h=>`<span style="left:${pos(h)}">${hhmm(h)}</span>`).join('')}</div></div>${rows}</div></div>
      <div class="row" style="padding:14px 4px 8px;border-top:1px solid var(--line3);margin-top:6px;font-size:14px;gap:10px 16px"><span class="row" style="gap:6px;font-weight:600"><span style="width:10px;height:10px;border-radius:2px;background:#C46A12;display:inline-block"></span>${esc(L('Regola spot'))}</span><span class="muted2">${c.audio.enabled?`${esc(L('1 spot ogni'))} <strong style="color:var(--text)">${esc(c.audio.interval_minutes)} min</strong> · max <strong style="color:var(--text)">${esc(c.audio.daily_limit)}</strong> ${esc(L('al giorno'))} · ${esc(L('volume'))} <strong style="color:var(--text)">${esc(c.audio.volume)}</strong> · ${esc(L('rotazione'))}: ${esc(rot)}`:esc(L('Pubblicità automatica spenta'))}</span><button class="btn-link" type="button" data-act="rule-open">${esc(L('Modifica'))}</button></div>
    </section><aside class="narrow" aria-label="${esc(L('Modifica'))}">${editor}</aside></div>`;
}

function slotEditor(){

const STEPS=[['Dispositivi'],['Contenuti'],['Pubblicità audio','Quando e dove'],['Musica di sottofondo'],['Schermi TV'],['Prova finale']];
function stepSummary(n){
  const c=cfg();
  return [()=>Lf('{0} Sonos, {1} TV',sonosAll().length,channels().length+(c.tv.player?1:0)),()=>Lf('{0} spot, {1} foto, {2} video',audioMedia().length,(S.state.media||[]).filter(m=>m.kind==='image').length,(S.state.media||[]).filter(m=>m.kind==='video').length),()=>c.audio.enabled?Lf('ogni {0} min',c.audio.interval_minutes):L('Quando e dove'),()=>Lf('{0} fasce',(c.music.slots||[]).length),()=>Lf('{0} canali',channels().length),()=>''][n-1]();

function stepDone(n){const c=cfg();return [sonosAll().length>0,(S.state.media||[]).length>0,c.audio.enabled&&(c.audio.ads||[]).length&&(c.audio.players||[]).length,(c.music.slots||[]).length>0,channels().some(ch=>(ch.playlist||[]).length),false][n-1]}
function pageGuidata(){
  const step=Math.min(6,Math.max(1,+S.param||1));
  const nav=`<nav aria-label="${esc(L('Passi della configurazione'))}"><ol class="steps">${STEPS.map((s,i)=>{const n=i+1,cur=n===step,done=!cur&&stepDone(n);return `<li class="${done?'done':''}"><a href="#/guidata/${n}" ${cur?'aria-current="step"':''}><span class="n">${done?icon('check',14):n}</span><div><div style="font-weight:${cur?700:600}">${esc(L(s[0]))}</div><div class="small muted">${esc(stepSummary(n))}</div></div></a></li>`}).join('')}</ol></nav>`;
  const body=[wizDevices,wizContent,wizAudio,wizMusic,wizScreens,wizTest][step-1]();
  const next=step<6?STEPS[step][0]:null;
  return `<div class="row" style="justify-content:space-between"><div class="small muted">${esc(Lf('Configurazione guidata · passo {0} di 6',step))}</div><div class="row"><label class="check small" style="align-items:center"><input type="checkbox" data-act="expert" ${S.expert?'checked':''}> ${esc(L('Modalità esperto'))}</label><a href="#/oggi" class="small" style="font-weight:600">${esc(L('Esci e continua dopo'))}</a></div></div>
    <div class="wiz">${nav}<div class="wiz-main">${body}
      <div class="wiz-foot">${step>1?`<a class="btn btn-ghost" href="#/guidata/${step-1}">${icon('left',16)}${esc(L('Indietro'))}</a>`:'<span></span>'}${next?`<button class="btn btn-primary" type="button" data-act="wiz-next" data-v="${step+1}">${esc(Lf('Salva e continua: {0}',L(next)))}${icon('right',16)}</button>`:`<button class="btn btn-primary" type="button" data-act="wiz-finish">${esc(L('Salva e vai a Oggi'))}</button>`}</div>
    </div>${wizAside(step)}</div>`;
}

function spotPreview(){
  const a=cfg().audio,day=todayIdx(),ads=a.ads||[],interval=+a.interval_minutes||30,limit=+a.daily_limit||20;
  if(!a.enabled)return{first:[],empty:L('La pubblicità automatica è spenta.')};
  if(!ads.length)return{first:[],empty:L('Scegli almeno uno spot.')};
  const wins=(a.schedule||[]).length?windowsOf(a.schedule,day):openWindows(day).length?openWindows(day):[[0,1440]];
  if(!wins.length)return{first:[],empty:L('Oggi non sono previsti spot.')};
  const list=[];let k=0;
  wins.forEach(([s,e])=>{for(let m=s;m<e&&list.length<limit;m+=interval){list.push({at:hhmm(m),name:a.mode==='rotate'?ads[k%ads.length]:ads[0]});k++}});
  const first=list.slice(0,5),rest=list.length-first.length;
  return{first,more:rest>0?Lf('… altri {0}, fino alle {1}{2}',rest,list.at(-1).at,list.length>=limit?' ('+Lf('limite {0} raggiunto',limit)+')':''):''};
}

function isoDay(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return isoDay(d)}
function histRange(){
  const h=S.hist,today=isoDay(new Date());
  if(h.period==='today')return[today,today];
  if(h.period==='30')return[daysAgo(29),today];
  if(h.period==='month'){const d=new Date();return[isoDay(new Date(d.getFullYear(),d.getMonth(),1)),today]}
  if(h.period==='custom')return[h.from||daysAgo(6),h.to||today];
  return[daysAgo(6),today];
}
async function loadHistory(){

  catch(e){S.hist.error=e.message}
  S.hist.loading=null;
  if(S.route==='storico'&&!busy())render();
}

function niceMax(v){if(v<=4)return 4;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return [1,2,3,4,5,6,8,10].find(x=>x>=n)*p}
function columnChart(items,{label,highlight}={}){
  // Colonne: una sola serie, base comune, griglia leggera, valore solo sul massimo.
  const max=niceMax(Math.max(1,...items.map(i=>i.v))*1.15),ticks=[0,max/2,max];

  return `<div class="cols" role="img" aria-label="${esc(label)}"><div class="yax">${ticks.map(t=>`<span style="bottom:${t/max*100}%">${t}</span>`).join('')}</div>

    <div class="xax">${items.map((i,n)=>`<span>${n%every===0?esc(i.x):''}</span>`).join('')}</div></div>`;

function getPath(path){return path.split('.').reduce((o,k)=>o?.[k],S.draft)}
function ensureScheduleRow(path){

}
function setPath(path,value){const keys=path.split('.'),last=keys.pop();let o=S.draft;for(const k of keys){if(o[k]==null)o[k]=/^\d+$/.test(k)?[]:{};o=o[k]}o[last]=value}

function setSlotEnd(s,end){let d=(toMin(end)-toMin(s.start)+1440)%1440;if(!d)d=60;s.duration_minutes=d;s.end=hhmm(toMin(s.start)+d)}
function setSlotSource(s,id){const f=(S.state.sonos_favorites||[]).find(x=>String(x.id)===String(id));if(!f)return;const type=String(f.type||'').toLowerCase();s.content_id=String(f.id);s.content_type=type==='sonos_source'?(/radio|fm/i.test(f.name)?'sonos_radio_source':'sonos_playlist_source'):(f.type||'favorite_item_id');s.title=f.name;s.name=f.name}
function newSlot(){
  const m=cfg().music;m.slots=m.slots||[];
  const day=todayIdx(),open=openWindows(day)[0]||[600,840],start=hhmm(open[0]),players=(cfg().audio.players||[]).length?[...cfg().audio.players]:sonosAll().filter(s=>s.available).map(s=>s.entity_id).slice(0,2);
  const f=(S.state.sonos_favorites||[])[0];
  const s={id:newId('music'),name:f?.name||L('Nuova playlist'),title:f?.name||'',enabled:true,content_id:f?String(f.id):'',content_type:'favorite_item_id',players,volume:25,start,duration_minutes:Math.min(240,open[1]-open[0]),days:[0,1,2,3,4]};
  if(f)setSlotSource(s,f.id);s.end=slotEnd(s);m.slots.push(s);

async function uploadFiles(files){
  for(const file of files){
    const ext=(file.name.split('.').pop()||'').toLowerCase(),kind=Object.keys(EXT).find(k=>EXT[k].includes(ext));
    if(!kind){toast(Lf('Formato non supportato: {0}',file.name),true);continue}
    if(file.size>4*1024**3){toast(Lf('{0} supera il limite di 4 GB',file.name),true);continue}
    try{
      S.uploading=Lf('Caricamento di {0}… non chiudere la pagina',file.name);render();
      let direct=false;try{direct=new URL(rt().media_base_url).hostname===location.hostname}catch(e){}
      if(direct){try{await request(rt().media_base_url+'/api/upload?filename='+encodeURIComponent(file.name)+'&kind='+kind,{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream'},body:file})}catch(e){direct=false}}
      if(!direct){
        const chunk=4*1024*1024,total=Math.ceil(file.size/chunk)||1,id=crypto.randomUUID?crypto.randomUUID():Date.now().toString(16)+Math.random().toString(16).slice(2);
        for(let i=0;i<total;i++){const q=new URLSearchParams({upload_id:id,filename:file.name,kind,index:String(i),total:String(total),size:String(file.size)});S.uploading=Lf('Caricamento di {0}: {1}%',file.name,Math.round(i/total*100));$('main').querySelectorAll('[role=status]').forEach(x=>x.textContent=S.uploading);await request('api/upload/chunk?'+q,{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file.slice(i*chunk,(i+1)*chunk)})}
      }
      toast(Lf('{0} caricato',file.name));
    }catch(e){toast(e.message,true)}
  }
  S.uploading='';await load();render();
}

document.addEventListener('click',e=>{
  const sk=e.target.closest('[data-set-key]');if(sk&&location.hash==='#/impostazioni/'+sk.dataset.setKey){e.preventDefault();scrollToSetting(sk.dataset.setKey);return}
  const popv=e.target.closest('[data-popv]');if(popv){S.popPick&&S.popPick(popv.dataset.popv);closePop();return}
  if(e.target.closest('[data-popok]')){const v=$('pop').querySelector('[data-pop-time]').value;if(v&&S.popPick)S.popPick(normClock(v));closePop();return}
  if(e.target.closest('[data-popclose]')){closePop();return}
  const p=e.target.closest('[data-pick]');if(p){pick(p);return}
  const a=e.target.closest('[data-act]');
  if(a&&a.tagName!=='INPUT'&&ACTIONS[a.dataset.act]){e.preventDefault();ACTIONS[a.dataset.act](a);return}
  if(!$('pop').hidden&&!e.target.closest('#pop'))closePop();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('pop').hidden){closePop()}else if(e.key==='Enter'&&e.target.matches('[data-pop-time]')){e.preventDefault();$('pop').querySelector('[data-popok]').click()}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.bind&&t.dataset.nore!==undefined){setPath(t.dataset.bind,t.value);renderSavebar();renderTop();return}
  if(t.dataset.bind&&t.type==='range'){setPath(t.dataset.bind,+t.value);document.querySelectorAll(`[data-out="${CSS.escape(t.dataset.bind)}"]`).forEach(o=>o.textContent=t.value);renderSavebar();renderTop()}
  if(t.dataset.zoneVolume!==undefined)document.querySelectorAll(`[data-out="zvol-${CSS.escape(t.dataset.zoneVolume)}"]`).forEach(o=>o.textContent=t.value);
  if(t.dataset.volume!==undefined)document.querySelectorAll(`[data-out="vol-${CSS.escape(t.dataset.volume)}"]`).forEach(o=>o.textContent=t.value);
  if(t.matches('[data-src-query]')){S.sel.srcQuery=t.value;clearTimeout(S.qt);S.qt=setTimeout(()=>{const pos=t.selectionStart;render();const n=document.querySelector('[data-src-query]');if(n){n.focus();n.setSelectionRange(pos,pos)}},250)}
  if(t.matches('[data-media-q]')){S.filter.q=t.value;clearTimeout(S.qt);S.qt=setTimeout(()=>{render();const n=document.querySelector('[data-media-q]');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}},250)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.bind&&t.dataset.nore!==undefined)return;
  if(t.dataset.bind&&t.type!=='range'){let v=t.type==='checkbox'?t.checked:t.value;if(t.dataset.num!==undefined||t.type==='number')v=+v;setPath(t.dataset.bind,v);render();return}
  if(t.dataset.volume){command('api/sonos/volume',{entity_id:t.dataset.volume,volume:+t.value});return}
  if(t.dataset.zoneVolume){const z=zoneById(t.dataset.zoneVolume),ids=(z?.players||[]).filter(id=>sonosById(id)?.available);Promise.all(ids.map(id=>post('api/sonos/volume',{entity_id:id,volume:+t.value}))).then(()=>{toast(Lf('Volume {0} impostato su {1} Sonos',t.value,ids.length));setTimeout(()=>load(),700)}).catch(e=>toast(e.message,true));return}
  // Campi orologio: un orario incompleto arriva vuoto e non deve diventare 00:00.
  if((t.dataset.time||t.dataset.slotStart!==undefined||t.dataset.slotEnd!==undefined)&&!t.value)return;
  if(t.dataset.time){ensureScheduleRow(t.dataset.time);const v=normClock(t.value);setPath(t.dataset.time,v);timeChanged(t);return}
  if(t.dataset.slotStart!==undefined){const before=slotsSnap(),s=cfg().music.slots[+t.dataset.slotStart],end=slotEnd(s);s.start=normClock(t.value);setSlotEnd(s,end);slotTimeChanged(t,before,s,'start');return}
  if(t.dataset.slotEnd!==undefined){const before=slotsSnap(),s=cfg().music.slots[+t.dataset.slotEnd];setSlotEnd(s,normClock(t.value));slotTimeChanged(t,before,s,'end');return}
  if(t.dataset.zoneName){editZone(t.dataset.zoneName,z=>z.name=t.value.trim()||z.name);return}
  if(t.dataset.menuPdf!==undefined){const f=t.files?.[0],ch=channels()[+t.dataset.menuPdf];if(!f||!ch)return;toast('Conversione del PDF in corso…');fetch('api/menu/pdf?filename='+encodeURIComponent(f.name),{method:'POST',headers:{'Content-Type':'application/pdf'},body:f}).then(r=>r.json().then(j=>{if(!r.ok||j.error)throw new Error(j.error||'Conversione non riuscita');return j})).then(j=>{const m=ch.menu=ch.menu||{};m.mode='images';m.page_images=j.pages.slice(0,12);toast(Lf('PDF convertito: {0} pagine',j.pages.length));load(true)}).catch(e=>toast(e.message,true));return}
  if(t.dataset.seqAdd){const ch=channelById(t.dataset.seqAdd),o=t.selectedOptions[0];if(!o?.value)return;ch.playlist=ch.playlist||[];ch.playlist.push(o.dataset.kind==='image'?{name:o.value,kind:'image',duration:12,fit:'smart',effect:'fade'}:{name:o.value,kind:'video',fit:'smart'});render();return}
  if(t.dataset.settingsJump!==undefined){const k=t.value;if(!k)return;S.sel.setScrolled=null;if(location.hash==='#/impostazioni/'+k)scrollToSetting(k);else location.hash='#/impostazioni/'+k;return}
  if(t.dataset.seqItem){const it=channelById(t.dataset.seqItem).playlist[+t.dataset.i];it[t.dataset.k]=t.type==='number'?Math.max(2,+t.value||12):t.value;render();return}
  if(t.dataset.channelZone!==undefined){const id=t.dataset.channelZone;(cfg().zones||[]).forEach(z=>{z.iptv_channels=(z.iptv_channels||[]).filter(x=>x!==id);if(z.id===t.value)z.iptv_channels.push(id)});render();return}
  if(t.dataset.collage){const it=channelById(t.dataset.collage).playlist[+t.dataset.i];it.images=it.images||[];if(t.checked){if(it.images.length>=6){t.checked=false;return toast('Massimo 6 fotografie per collage',true)}it.images.push(t.value)}else it.images=it.images.filter(x=>x!==t.value);render();return}

document.addEventListener('mouseover',e=>{const el=e.target.closest?.('[data-tip]');if(el)showTip(el);else $('tip').hidden=true});
